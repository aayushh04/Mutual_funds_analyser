[theme]
# "Research Desk": a broker's research note at night. Warm charcoal, ivory ink, one house gold.
base = "dark"
primaryColor = "#8a6a22"
backgroundColor = "#111315"
secondaryBackgroundColor = "#1a1d21"
textColor = "#e9e4da"
linkColor = "#d6b25e"
borderColor = "#2a2d31"
baseRadius = "small"
showWidgetBorder = true
font = "'Source Sans 3':https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap"
headingFont = "'Source Serif 4':https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap"
headingFontSizes = ["2rem", "1.35rem", "1.12rem"]
headingFontWeights = [600, 600, 600]

[client]
toolbarMode = "viewer"

[server]
headless = true
